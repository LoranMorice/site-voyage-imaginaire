<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Admin légendes — Voyage en Imaginaire</title>
<style>
  :root {
    --ink: #0d1020; --ink2: #151a30; --line: #2a3150;
    --text: #eceadf; --muted: #98a0bb; --gold: #d8b26a;
    --gold-soft: rgba(216,178,106,.16);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ink); color: var(--text);
    font: 15px/1.55 -apple-system, system-ui, sans-serif;
  }
  a { color: var(--gold); }

  /* ---------- Écran de connexion ---------- */
  .gate { position: fixed; inset: 0; display: grid; place-items: center; padding: 1.5rem; }
  .gate__box {
    width: 100%; max-width: 380px; text-align: center;
    background: var(--ink2); border: 1px solid var(--line);
    border-radius: 14px; padding: 2rem 1.6rem;
  }
  .gate__box h1 { font-size: 1.25rem; margin: 0 0 .3rem; }
  .gate__box p { color: var(--muted); font-size: .86rem; margin: 0 0 1.4rem; }
  input[type=password], input[type=text] {
    width: 100%; padding: .7rem .9rem; font: inherit;
    background: rgba(255,255,255,.04); color: var(--text);
    border: 1px solid var(--line); border-radius: 9px; outline: none;
  }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  button {
    font: inherit; font-weight: 500; cursor: pointer; border: 0;
    padding: .7rem 1.3rem; border-radius: 9px;
    background: var(--gold); color: #14182c;
  }
  button:hover { filter: brightness(1.08); }
  button.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); }
  .gate__box button { width: 100%; margin-top: .8rem; }
  .err { color: #ff9494; font-size: .84rem; margin-top: .7rem; min-height: 1.1em; }

  /* ---------- Barre du haut ---------- */
  header {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 1rem; flex-wrap: wrap;
    padding: .9rem 1.3rem; background: var(--ink2);
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 1.02rem; margin: 0; font-weight: 600; }
  header .sub { color: var(--muted); font-size: .8rem; }
  header .spacer { flex: 1; }
  .status { font-size: .82rem; color: var(--muted); }
  .status.saved { color: #7fe0a4; }
  .status.dirty { color: var(--gold); }

  /* ---------- Onglets ---------- */
  .tabs { display: flex; gap: .4rem; flex-wrap: wrap; padding: .9rem 1.3rem 0; }
  .tabs button {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); border-radius: 999px;
    padding: .4rem .95rem; font-size: .84rem;
  }
  .tabs button.on { background: var(--gold-soft); color: var(--text); border-color: var(--gold); }
  .tabs .count { opacity: .6; font-variant-numeric: tabular-nums; }

  /* ---------- Grille ---------- */
  main { padding: 1.2rem 1.3rem 4rem; }
  .grid {
    display: grid; gap: 1.1rem;
    grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  }
  .card {
    background: var(--ink2); border: 1px solid var(--line);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  }
  .thumb {
    height: 150px; display: grid; place-items: center;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,.02) 0 10px, transparent 10px 20px), #0f1326;
    overflow: hidden;
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .thumb.audio { font-size: 2.4rem; }
  .thumb .disc {
    width: 78px; height: 78px; border-radius: 50%;
    background: radial-gradient(circle, #0f1326 0 18%, transparent 18.5%),
                conic-gradient(from 0deg, var(--gold), #7a5f2f, var(--gold), #7a5f2f, var(--gold));
  }
  .card__body { padding: .7rem .75rem .85rem; display: flex; flex-direction: column; gap: .45rem; }
  .card__name {
    font-size: .74rem; color: var(--muted); word-break: break-word;
    font-variant-numeric: tabular-nums;
  }
  /* Champ légende encadré, en dessous de la vignette */
  .card textarea {
    width: 100%; min-height: 58px; resize: vertical; font: inherit; font-size: .88rem;
    padding: .55rem .65rem; color: var(--text);
    background: rgba(255,255,255,.03);
    border: 1px solid var(--line); border-radius: 8px; outline: none;
  }
  .card textarea:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .card.changed textarea { border-color: var(--gold); }

  .empty { color: var(--muted); padding: 2rem 0; text-align: center; }
  footer {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; align-items: center; gap: 1rem;
    padding: .8rem 1.3rem; background: var(--ink2); border-top: 1px solid var(--line);
  }
  footer .spacer { flex: 1; }
  .toast {
    position: fixed; left: 50%; bottom: 5rem; transform: translateX(-50%);
    background: var(--ink2); border: 1px solid var(--gold-soft);
    border-radius: 999px; padding: .7rem 1.3rem; font-size: .86rem;
    box-shadow: 0 14px 40px rgba(0,0,0,.5); z-index: 50;
  }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<!-- ================= CONNEXION ================= -->
<div class="gate" id="gate">
  <div class="gate__box">
    <h1>Console des légendes</h1>
    <p>Accès réservé — mot de passe des onglets protégés.</p>
    <form id="gateForm" autocomplete="off">
      <input type="password" id="pass" placeholder="••••••••••••••" required />
      <div class="err" id="gateErr"></div>
      <button type="submit">Entrer</button>
    </form>
  </div>
</div>

<!-- ================= APPLICATION ================= -->
<div id="app" hidden>
  <header>
    <div>
      <h1>Console des légendes</h1>
      <div class="sub">Voyage en Imaginaire — LoranG</div>
    </div>
    <div class="spacer"></div>
    <span class="status" id="status">Reliez votre dossier pour commencer</span>
    <button id="connect">Relier mon dossier</button>
  </header>

  <div class="tabs" id="tabs"></div>

  <main>
    <div class="grid" id="grid"></div>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer>
    <span class="sub" id="foot">—</span>
    <div class="spacer"></div>
    <button class="ghost" id="reload">Recharger depuis le disque</button>
    <button id="save">Enregistrer cet onglet</button>
  </footer>
</div>

<div class="toast" id="toast" hidden></div>

<script>
"use strict";

/* ---- Réglages, alignés sur app.js ---- */
const CAPTIONS_FILE = "legendes.txt";
const MINUTE_TOLERANCE = 3;
const IMG = ["jpg","jpeg","png","gif","webp","avif","svg","bmp","heic","heif","tif","tiff"];
const AUD = ["mp3","wav","m4a","aac","ogg","oga","flac","opus","aiff","aif","wma"];
const CATS = {
  photo:    { dir: "1-Photo",    label: "1 · Photo" },
  graphi:   { dir: "2-Graphi",   label: "2 · Graphi" },
  audio:    { dir: "3-Audio",    label: "3 · Audio" },
  perso:    { dir: "4-Perso",    label: "4 · Perso" },
  reserves: { dir: "5-Reserves", label: "5 · Réserves" },
};

const $ = (s, r=document) => r.querySelector(s);
const pad = n => String(n).padStart(2,"0");
const extOf = n => { const i=n.lastIndexOf("."); return i<0?"":n.slice(i+1).toLowerCase(); };
const isImg = n => IMG.includes(extOf(n));
const isAud = n => AUD.includes(extOf(n));

/* ---- Mot de passe horaire JJMMAAAAHH:MM (identique au site) ---- */
function minuteCode(d){ return pad(d.getDate())+pad(d.getMonth()+1)+d.getFullYear()+pad(d.getHours())+pad(d.getMinutes()); }
function passValid(raw){
  const clean = String(raw).replace(/[^0-9]/g,"");
  const now = Date.now();
  for (let i=-MINUTE_TOLERANCE; i<=MINUTE_TOLERANCE; i++){
    if (clean === minuteCode(new Date(now + i*60000))) return true;
  }
  return false;
}

/* ---- Lecture / écriture du format legendes.txt ---- */
// Renvoie { map, header } : map nom→légende, header = commentaires d'origine.
function parseCaptions(txt){
  const map = new Map(); const header = [];
  let bodyStarted = false;
  txt.split(/\r?\n/).forEach(line => {
    const row = line.trim();
    if (!bodyStarted && (row==="" || row.startsWith("#"))) { header.push(line); return; }
    if (!row || row.startsWith("#")) return;
    const cand = [row.indexOf("="), row.indexOf("|")].filter(i=>i>0);
    if (!cand.length) return;
    bodyStarted = true;
    const sep = Math.min(...cand);
    map.set(row.slice(0,sep).trim().toLowerCase(), row.slice(sep+1).trim());
  });
  return { map, header };
}
function buildCaptions(header, entries){
  const lines = [];
  if (header.length) lines.push(header.join("\n").replace(/\n+$/,""), "");
  entries.forEach(([name, cap]) => { if (cap.trim()) lines.push(name + " = " + cap.trim()); });
  return lines.join("\n") + "\n";
}

/* ---- État ---- */
const state = { root:null, current:"photo", data:{}, urls:[] };
Object.keys(CATS).forEach(k => state.data[k] = { files:[], caps:new Map(), header:[], dirty:false });

/* ---- Dossier mémorisé (partagé avec le site via IndexedDB « vei-store ») ---- */
function openDB(){
  return new Promise((res,rej)=>{
    const q = indexedDB.open("vei-store", 1);
    q.onupgradeneeded = () => q.result.createObjectStore("kv");
    q.onsuccess = () => res(q.result);
    q.onerror = () => rej(q.error);
  });
}
async function idbGet(key){
  try {
    const db = await openDB();
    return await new Promise((res,rej)=>{
      const t = db.transaction("kv","readonly").objectStore("kv").get(key);
      t.onsuccess = ()=>res(t.result); t.onerror = ()=>rej(t.error);
    });
  } catch { return undefined; }
}
async function idbSet(key,val){
  try {
    const db = await openDB();
    await new Promise((res,rej)=>{
      const tx = db.transaction("kv","readwrite");
      tx.objectStore("kv").put(val,key);
      tx.oncomplete = res; tx.onerror = ()=>rej(tx.error);
    });
  } catch {}
}

// Vérifie qu'un handle pointe bien sur la racine (contient au moins un des dossiers).
async function estRacine(handle){
  for (const c of Object.values(CATS)){
    try { await handle.getDirectoryHandle(c.dir); return true; } catch {}
  }
  return false;
}

// Tente de relier automatiquement le dossier déjà autorisé sur le site.
async function relierAuto(){
  if (typeof window.showDirectoryPicker !== "function") return false;
  const h = await idbGet("rootHandle");
  if (!h) return false;
  try {
    if (await h.queryPermission({ mode:"readwrite" }) !== "granted") return false;
    if (!(await estRacine(h))) return false;
    state.root = h;
    await loadAll();
    setStatus("Dossier relié automatiquement : " + h.name, "saved");
    return true;
  } catch { return false; }
}

const toast = (m, ms=2400) => {
  const t=$("#toast"); t.textContent=m; t.hidden=false;
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, ms);
};
function setStatus(txt, cls=""){ const s=$("#status"); s.textContent=txt; s.className="status "+cls; }

/* ---- Connexion ---- */
$("#gateForm").addEventListener("submit", e => {
  e.preventDefault();
  if (passValid($("#pass").value)) {
    $("#gate").hidden = true; $("#app").hidden = false;
    if (typeof window.showDirectoryPicker !== "function") {
      setStatus("Ce navigateur ne peut pas écrire les fichiers — utilisez Chrome.", "dirty");
      $("#connect").disabled = true;
    } else {
      // Si le site a déjà autorisé le dossier, on le relie sans rien demander.
      relierAuto();
    }
  } else {
    $("#gateErr").textContent = "Mot de passe incorrect.";
    $("#pass").value = ""; $("#pass").focus();
  }
});

/* ---- Relier le dossier + lire les 5 sous-dossiers ---- */
$("#connect").addEventListener("click", async () => {
  try {
    const root = await window.showDirectoryPicker({ mode:"readwrite" });
    // Vérifie que c'est bien la racine
    let ok=false;
    for (const c of Object.values(CATS)) { try { await root.getDirectoryHandle(c.dir); ok=true; break; } catch{} }
    if (!ok) { toast("Choisissez le dossier « Voyage-en-Imaginaire »."); return; }
    state.root = root;
    await idbSet("rootHandle", root);      // mémorisé pour le site et les prochaines fois
    await loadAll();
    setStatus("Dossier relié : " + root.name, "saved");
  } catch(e){ if (e.name!=="AbortError") toast("Liaison annulée."); }
});

$("#reload").addEventListener("click", async () => {
  if (!state.root) { toast("Reliez d'abord votre dossier."); return; }
  if (Object.values(state.data).some(d=>d.dirty) &&
      !confirm("Des légendes non enregistrées seront perdues. Recharger quand même ?")) return;
  await loadAll();
  toast("Rechargé depuis le disque.");
});

async function loadAll(){
  for (const key of Object.keys(CATS)){
    const d = state.data[key];
    d.files=[]; d.caps=new Map(); d.header=[]; d.dirty=false;
    try {
      const dir = await state.root.getDirectoryHandle(CATS[key].dir);
      for await (const e of dir.values()){
        if (e.kind!=="file" || e.name.startsWith(".")) continue;
        if (e.name===CAPTIONS_FILE){
          const parsed = parseCaptions(await (await e.getFile()).text());
          d.caps = parsed.map; d.header = parsed.header;
          continue;
        }
        if (isImg(e.name) || isAud(e.name)) d.files.push({ name:e.name, handle:e });
      }
      d.files.sort((a,b)=>a.name.localeCompare(b.name,"fr",{numeric:true}));
    } catch { /* dossier absent : ignoré */ }
  }
  renderTabs();
  render();
}

function renderTabs(){
  const t = $("#tabs"); t.innerHTML="";
  Object.entries(CATS).forEach(([key,c])=>{
    const b=document.createElement("button");
    b.className = key===state.current ? "on" : "";
    b.innerHTML = c.label + ' <span class="count">'+state.data[key].files.length+'</span>';
    b.onclick = ()=>{ state.current=key; renderTabs(); render(); };
    t.appendChild(b);
  });
}

function releaseUrls(){ state.urls.forEach(URL.revokeObjectURL); state.urls=[]; }

async function render(){
  releaseUrls();
  const key = state.current, d = state.data[key];
  const grid=$("#grid"), empty=$("#empty");
  grid.innerHTML="";

  const n = d.files.length;
  const done = d.files.filter(f=>d.caps.get(f.name.toLowerCase())).length;
  $("#foot").textContent = CATS[key].label + " — " + n + " fichier(s), " + done + " légende(s) posée(s)";

  if (!n){
    empty.hidden=false;
    empty.textContent = state.root ? "Aucun fichier dans ce dossier." : "Reliez votre dossier pour voir les fichiers.";
    return;
  }
  empty.hidden=true;

  for (const f of d.files){
    const card=document.createElement("div"); card.className="card";
    const thumb=document.createElement("div"); thumb.className="thumb";

    if (isAud(f.name)) { thumb.classList.add("audio"); thumb.innerHTML='<div class="disc"></div>'; }
    else {
      const img=document.createElement("img");
      try { const url=URL.createObjectURL(await f.handle.getFile()); state.urls.push(url); img.src=url; } catch{}
      img.onerror=()=>{ thumb.textContent="🖼️ aperçu indisponible"; };
      thumb.appendChild(img);
    }

    const body=document.createElement("div"); body.className="card__body";
    const name=document.createElement("div"); name.className="card__name"; name.textContent=f.name;
    const ta=document.createElement("textarea");
    ta.placeholder="Légende…";
    ta.value = d.caps.get(f.name.toLowerCase()) || "";
    ta.addEventListener("input", ()=>{
      d.caps.set(f.name.toLowerCase(), ta.value);
      d.dirty=true; card.classList.toggle("changed", !!ta.value.trim());
      setStatus("Modifications non enregistrées", "dirty");
    });
    if (ta.value.trim()) card.classList.add("changed");

    body.append(name, ta);
    card.append(thumb, body);
    grid.appendChild(card);
  }
}

/* ---- Enregistrer l'onglet courant dans son legendes.txt ---- */
$("#save").addEventListener("click", async () => {
  if (!state.root) { toast("Reliez d'abord votre dossier."); return; }
  const key = state.current, d = state.data[key];
  try {
    const dir = await state.root.getDirectoryHandle(CATS[key].dir);
    // On écrit une entrée pour chaque fichier présent, dans l'ordre.
    const entries = d.files.map(f => {
      const cap = d.caps.get(f.name.toLowerCase()) || "";
      return [f.name, cap];
    });
    const header = d.header.length ? d.header : ["# Légendes — une ligne par fichier :  nom = légende"];
    const txt = buildCaptions(header, entries);
    const fh = await dir.getFileHandle(CAPTIONS_FILE, { create:true });
    const w = await fh.createWritable();
    await w.write(txt); await w.close();
    d.dirty=false;
    setStatus("Enregistré ✓", "saved");
    toast("Légendes de « "+CATS[key].label+" » enregistrées.");
    render();
  } catch(e){ toast("Échec de l'enregistrement : "+e.message); }
});

/* Prévenir avant de quitter si des changements ne sont pas sauvés */
window.addEventListener("beforeunload", e => {
  if (Object.values(state.data).some(d=>d.dirty)) { e.preventDefault(); e.returnValue=""; }
});
</script>
</body>
</html>
